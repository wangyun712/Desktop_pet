<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PetPal 重力下落 — 手感演示</title>
<style>
  :root {
    --bg: #f4f4f7; --panel: #ffffff; --ink: #23252b; --dim: #6b6f7a;
    --line: #d9dbe2; --accent: #4a6cf7; --ground: #d05555;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1d21; --panel:#26272c; --ink:#e9eaee; --dim:#9aa0ad;
            --line:#3a3c44; --accent:#7f97ff; --ground:#e07a7a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px; background: var(--bg); color: var(--ink);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 16px; }
  .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }

  .stage {
    position: relative; width: 280px; height: 600px; flex: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden;
  }
  .grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px),
                      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 30px 30px; }
  #pet {
    position: absolute; left: 50%; transform: translateX(-50%); top: 0;
    image-rendering: -webkit-optimize-contrast; z-index: 2;
  }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 18px; height: 2px;
    background: var(--ground); z-index: 3;
  }
  .ground-tag {
    position: absolute; right: 6px; bottom: 22px; font-size: 10.5px;
    color: var(--ground); z-index: 4;
  }
  .shadow {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 74px; height: 9px; border-radius: 50%; z-index: 1;
    background: rgba(0,0,0,.18); filter: blur(3px);
    bottom: 15px; opacity: .35;
  }

  .panel { flex: 1 1 320px; min-width: 300px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
  .row label { flex: none; width: 82px; color: var(--dim); font-size: 12.5px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .val { flex: none; width: 100px; text-align: right;
         font-family: Consolas, monospace; font-size: 12.5px; }
  button {
    font: inherit; padding: 7px 15px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td { padding: 3px 0; }
  td:first-child { color: var(--dim); }
  td:last-child { text-align: right; font-family: Consolas, monospace; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .04s linear; }
  .note { color: var(--dim); font-size: 12px; }
  code { font-family: Consolas, monospace; background: var(--bg);
         padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<h1>PetPal 重力下落 — 手感演示</h1>
<div class="sub">公式与程序里那份 <code>petFallAdvance()</code> 完全一致：v += g·dt，y += v·dt，dt = 16ms。
红线就是屏幕可用区底边，也是角色最后站着的那条线。</div>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="grid"></div>
    <div class="shadow" id="shadow"></div>
    <img id="pet" alt="">
    <div class="ground"></div>
    <div class="ground-tag">ground</div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="row">
        <label>重力 g</label>
        <input type="range" id="g" min="600" max="4600" step="50" value="2200">
        <span class="val" id="gv">2200 px/s²</span>
      </div>
      <div class="row">
        <label>起始高度</label>
        <input type="range" id="h" min="40" max="300" step="10" value="300">
        <span class="val" id="hv">300 px</span>
      </div>
      <div class="row">
        <label>终端速度</label>
        <input type="range" id="vt" min="400" max="4000" step="100" value="1800">
        <span class="val" id="vtv">1800 px/s</span>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="primary" id="drop">松手（开始掉落）</button>
        <button id="reset">重置</button>
      </div>
      <div class="note">手感参考：1200 = 飘（像羽毛）　2200 = 当前默认　4000 = 砸（很实在）</div>
    </div>

    <div class="card">
      <table>
        <tr><td>状态</td><td id="s-state">被拎着</td></tr>
        <tr><td>垂直速度 v</td><td id="s-v">0.0 px/s</td></tr>
        <tr><td>已下落</td><td id="s-d">0 px</td></tr>
        <tr><td>已用时</td><td id="s-t">0 ms</td></tr>
      </table>
      <div class="bar"><i id="s-bar"></i></div>
    </div>

    <div class="card note" id="verdict">
      把 g 拖着感受一下，挑好了就把 <code>PetCfg::GRAVITY_PPS2</code> 改成同一个数 —— 只改这一个常量，别的地方不用动。
    </div>
  </div>
</div>

};
// 三张画布的真实尺寸（来自自检报告）：站立 183x252，拖拽/下落都是 183x264
const BOX  = { idle: [183, 252], drag: [183, 264], fall: [183, 264] };
const LIFT = 12;              // 拖拽图/下落图里角色底边距画布底边的悬空量
const GROUND_PAD = 18;        // 地面线距舞台底部的视觉留白

const stage  = document.getElementById('stage');
const petImg = document.getElementById('pet');
const shadow = document.getElementById('shadow');
const elG = document.getElementById('g'), elH = document.getElementById('h'), elVt = document.getElementById('vt');
const elGv = document.getElementById('gv'), elHv = document.getElementById('hv'), elVtv = document.getElementById('vtv');
const btnDrop = document.getElementById('drop'), btnReset = document.getElementById('reset');

let y = 0, v = 0, t = 0, timer = null, phase = 'held';

// 地面线：窗口底边能到的最低位置
const groundY = () => stage.clientHeight - GROUND_PAD - 1;
// 松手时窗口顶边的位置（窗口高 264）
const startTop = () => groundY() - Number(elH.value) - BOX.fall[1];
// 松手时窗口底边的位置 —— 后面算"下落了多少"都以它为基准
const baseBottom = () => startTop() + BOX.fall[1];

function curKind() {
  return phase === 'held' ? 'drag' : (phase === 'fallen' ? 'idle' : 'fall');
}

function render() {
  const kind = curKind();
  const [w, h] = BOX[kind];
  if (petImg.dataset.kind !== kind) {
    petImg.src = IMG[kind];
    petImg.width = w; petImg.height = h;
    petImg.dataset.kind = kind;
  }
  petImg.style.top = y + 'px';

  // 离地面越近，影子越实越大
  const reach = Math.max(1, groundY() - baseBottom());
  const near = 1 - Math.max(0, groundY() - (y + h)) / reach;
  shadow.style.opacity = (0.28 + 0.62 * near).toFixed(2);
  shadow.style.transform = 'translateX(-50%) scale(' + (0.62 + 0.5 * near).toFixed(2) + ')';
}

function hud(label) {
  const h = BOX[curKind()][1];
  const drop = Math.max(0, Math.min(groundY() - baseBottom(), (y + h) - baseBottom()));
  const total = Math.max(1, groundY() - baseBottom());
  document.getElementById('s-state').textContent = label;
  document.getElementById('s-v').textContent = v.toFixed(1) + ' px/s';
  document.getElementById('s-d').textContent = Math.round(drop) + ' px';
  document.getElementById('s-t').textContent = Math.round(t) + ' ms';
  document.getElementById('s-bar').style.width = Math.min(100, drop / total * 100).toFixed(1) + '%';
}

function reset() {
  if (timer) { clearInterval(timer); timer = null; }
  phase = 'held';
  y = startTop(); v = 0; t = 0;
  render();
  hud('被拎着（p30）');
  btnDrop.disabled = false;
  btnDrop.textContent = '松手（开始掉落）';
}

function drop() {
  if (timer) return;
  phase = 'falling';
  y = startTop(); v = 0; t = 0;
  render();
  hud('下落中（p31）');
  btnDrop.disabled = true;

  const g = Number(elG.value);
  const vmax = Number(elVt.value);
  const dt = 0.016;                      // 与 PetCfg::TICK_MS = 16 一致

  timer = setInterval(function () {
    // ---- 与 C++ petFallAdvance() 完全相同的两步 ----
    v = Math.min(v + g * dt, vmax);
    y = y + v * dt;
    t += 16;

    const landedTop = groundY() - BOX.fall[1];
    if (y >= landedTop) {
      y = landedTop;
      clearInterval(timer); timer = null;

      // 落地：窗口底边钉在地面，高度从 264 收到 252 -> 顶边下移 12px（底边不动）
      // 于是角色脚正好从"离地 12px"沉到地面上
      y += BOX.fall[1] - BOX.idle[1];
      phase = 'fallen';
      render();
      hud('落地站定（p08）');
      btnDrop.disabled = false;
      btnDrop.textContent = '再掉一次';
      document.getElementById('verdict').innerHTML =
        '落地用时约 <b>' + Math.round(t) + ' ms</b>，落地速度 <b>' + v.toFixed(0) + ' px/s</b>。' +
        ' 这个手感合适的话，把 <code>PetCfg::GRAVITY_PPS2</code> 设成 <b>' + g + '</b> 就行。';
      return;
    }
    render();
    hud('下落中（p31）');
  }, 16);
}

function onParam() {
  elGv.textContent  = elG.value  + ' px/s²';
  elHv.textContent  = elH.value  + ' px';
  elVtv.textContent = elVt.value + ' px/s';
  if (!timer && phase !== 'falling') reset();
}

elG.addEventListener('input', onParam);
elH.addEventListener('input', onParam);
elVt.addEventListener('input', onParam);
btnDrop.addEventListener('click', drop);
btnReset.addEventListener('click', reset);

reset();
</script>
</body>
</html>
